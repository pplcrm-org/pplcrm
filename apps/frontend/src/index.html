<!doctype html>

    <meta
      name="description"
      content="One list for constituents, voters, donors and volunteers — with a shared inbox, canvassing, donations and field apps built in."
    />
    <!-- This shell is the private CRM (app.pplcrm.com) and the per-tenant public
         form pages (*.pplforms.com) — neither is search content. Keep it out of
         indexes; the marketing site (pplcrm.com) carries all SEO. Share cards
         above still work regardless of this. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Social preview. This shell serves app.pplcrm.com and the public form
         pages on *.pplforms.com, so og:url is intentionally omitted (scrapers
         use the real shared URL) and the card is the generic pplCRM brand card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="pplCRM" />
    <meta property="og:title" content="pplCRM — Know your neighbours" />
    <meta
      property="og:description"
      content="One list for constituents, voters, donors and volunteers. Shared inbox, canvassing, donations and field apps."
    />
    <meta property="og:image" content="https://pplcrm.com/assets/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="pplCRM — know your neighbours." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="pplCRM — Know your neighbours" />
    <meta
      name="twitter:description"
      content="One list for constituents, voters, donors and volunteers. Shared inbox, canvassing, donations and field apps."

    <meta name="twitter:image" content="https://pplcrm.com/assets/og-card.png" />

    <!-- Tells the browser this document is styled for both appearances, so native
         surfaces it draws itself (scrollbars, form controls, the canvas behind the
         page) follow the resolved theme instead of defaulting to light. -->
    <meta name="color-scheme" content="light dark" />

    <!-- Resolve the theme BEFORE the first paint.

         ThemeService (apps/frontend/src/app/layout/theme/theme-service.ts) is an Angular
         service, so it cannot run until the JS bundle has downloaded, parsed and booted.
         Everything painted before that — the browser canvas and the boot skeleton in the
         body below — used the light theme, which is a full-page white flash for anyone
         on the dark theme.

         This mirrors ThemeService's resolution order with one omission: the workspace
         default (`appearance.theme`) needs a server round-trip, so a user who has never
         stated a personal preference gets the OS preference here and ThemeService
         re-stamps the element with the workspace value once settings arrive. If either
         localStorage or matchMedia is unavailable the attribute is simply not set, and
         DaisyUI's light theme applies as before.

         Keep the storage key ('pc-theme') and the accepted values in step with
         ThemeService.updateTheme(). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pc-theme');
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme:dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
        } catch {
          /* Storage blocked (private mode, embedded webview): keep the light default. */
        }
      })();
    </script>
  </head>
