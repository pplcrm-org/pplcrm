<!-- gap-3 between buttons is deliberately wider than the .btn's own 6px icon↔label gap,
     so two separate controls never read as one blob. Do not add a `gap-*` class to the
     buttons themselves — that would override the tighter inner gap and flatten the two. -->
<div class="flex gap-3 justify-center">
  <button
    type="button"
    class="btn btn-primary"
    [class.btn-xs]="size() === 'xs'"
    [class.btn-sm]="size() === 'sm'"
    (click)="handleBtn1Clicked()"
    [disabled]="isSaveDisabled"
  >
    @if (isLoading()) {
    <span class="loading loading-spinner loading-xs text-primary-content"></span>
    } @else {
    <pc-icon [name]="btn1Icon()" [size]="4" />
    } {{ btn1Text() }}
  </button>

  @if (showDelete()) {
  <button
    type="button"
    class="btn btn-error btn-outline"
    [class.btn-xs]="size() === 'xs'"
    [class.btn-sm]="size() === 'sm'"
    (click)="handleDeleteClicked()"
    [disabled]="isLoading()"
  >
    <pc-icon name="trash" [size]="4" />
    {{ deleteText() }}
  </button>
  } @if (buttonsToShow() === 'three' && !showDelete()) {
  <button
    type="button"
    class="btn btn-primary"
    [class.btn-xs]="size() === 'xs'"
    [class.btn-sm]="size() === 'sm'"
    (click)="handleBtn2Clicked()"
    [disabled]="isSaveDisabled"
  >
    @if (isLoading()) {
    <span class="loading loading-spinner loading-xs text-primary-content"></span>
    } @else { {{ btn2Text() }} }
  </button>
  } @if (showCancel()) {
  <button
    type="button"
    class="btn btn-outline btn-accent"
    [class.btn-xs]="size() === 'xs'"
    [class.btn-sm]="size() === 'sm'"
    (click)="cancel()"
    [disabled]="isLoading()"
  >
    <pc-icon name="x-mark" [size]="4" />
    Cancel
  </button>
  }
</div>
