<!--
  aria-live on the container, not the toast: the region has to exist in the DOM before a toast is
  inserted into it, or assistive tech has nothing to observe and the announcement is missed.
-->
<div
  aria-live="polite"
  aria-atomic="false"
  class="pointer-events-none z-50 flex w-full flex-col items-center gap-2 px-4"
  [class.absolute]="!isPositionRelative()"
  [class.left-0]="!isPositionRelative()"
  [class.top-4]="isPositionTop()"
  [class.bottom-4]="isPositionBottom()"
>
  @for (alert of alerts(); track alert.id) {
  <div
    class="pc-overlay pointer-events-auto relative flex max-w-[520px] cursor-pointer items-start gap-3 overflow-hidden rounded-[12px] py-3 pl-4 pr-3.5"
    role="alert"
    tabindex="0"
    [attr.aria-label]="'Dismiss notification: ' + alert.text"
    *pcAnimateIf="alert.visible; enter: getEnterAnim(); exit: getExitAnim()"
    (click)="dismiss(alert.id)"
    (keydown.enter)="dismiss(alert.id)"
    (keydown.space)="dismiss(alert.id); $event.preventDefault()"
    (keydown.escape)="dismiss(alert.id)"
  >
    <span aria-hidden="true" class="absolute inset-y-0 left-0 w-[5px] {{ barToneClass(alert.type) }}"></span>
    <span
      aria-hidden="true"
      class="mt-px flex shrink-0 items-center justify-center rounded-[8px] p-1.5 {{ chipToneClass(alert.type) }}"
    >
      <pc-icon [name]="icon(alert.type)" [size]="4" class="{{ toneClass(alert.type) }}"></pc-icon>
    </span>
    <div class="line-clamp-3 text-xs leading-[1.45] text-base-content [overflow-wrap:anywhere]">{{ alert.text }}</div>
    @if (alert.count() > 1) {
    <span
      class="mt-px shrink-0 rounded-full bg-base-content/10 px-[7px] py-px text-[10.5px] font-semibold tabular-nums text-base-content"
    >
      ×{{ alert.count() }}
    </span>
    }
  </div>
  }
</div>
